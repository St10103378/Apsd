version: 2.1

executors:
  dotnet10:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    working_directory: ~/project

jobs:
  build:
    executor: dotnet10

    steps:
      - checkout

      - restore_cache:
          keys:
            - nuget-v1-{{ checksum "SecurePortal.csproj" }}
            - nuget-v1-

      - run:
          name: Restore packages
          command: dotnet restore SecurePortal.csproj

      - save_cache:
          key: nuget-v1-{{ checksum "SecurePortal.csproj" }}
          paths:
            - /root/.nuget/packages

      - run:
          name: Build
          command: >
            dotnet build SecurePortal.csproj
            --configuration Release
            --no-restore

      - run:
          name: Run tests
          command: >
            dotnet test SecurePortal.csproj
            --configuration Release
            --no-build
            --logger trx

  sonarcloud:
    executor: dotnet10

    steps:
      - checkout

      - restore_cache:
          keys:
            - nuget-v1-{{ checksum "SecurePortal.csproj" }}
            - nuget-v1-

      - run:
          name: Install SonarScanner
          command: |
            dotnet tool install --global dotnet-sonarscanner
            echo 'export PATH="$PATH:/root/.dotnet/tools"' >> "$BASH_ENV"

      - run:
          name: Restore dependencies
          command: dotnet restore SecurePortal.csproj

      - run:
          name: Begin SonarCloud analysis
          command: |
            dotnet sonarscanner begin \
              /k:"${SONAR_PROJECT_KEY}" \
              /o:"${SONAR_ORG}" \
              /d:sonar.host.url="https://sonarcloud.io" \
              /d:sonar.token="${SONAR_TOKEN}" \
              /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
              /d:sonar.coverage.exclusions="**/Migrations/**,**/bin/**,**/obj/**,**/*Tests*/**"

      - run:
          name: Build
          command: |
            dotnet build SecurePortal.csproj \
              --configuration Release \
              --no-restore

      - run:
          name: Test with coverage
          command: |
            dotnet test SecurePortal.csproj \
              --configuration Release \
              --no-build \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=opencover

      - run:
          name: End SonarCloud analysis
          command: |
            dotnet sonarscanner end \
              /d:sonar.token="${SONAR_TOKEN}"

workflows:
  version: 2

  build-and-analyze:
    jobs:
      - build

      - sonarcloud:
          requires:
            - build
