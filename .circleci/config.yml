version: 2.1

jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    working_directory: ~/repo
    steps:
      - checkout

      # Restore with caching
      - restore_cache:
          keys:
            - dotnet-deps-v1-{{ checksum "SecurePortal.csproj" }}
            - dotnet-deps-v1-

      - run:
          name: Restore dependencies
          command: dotnet restore SecurePortal.csproj

      - save_cache:
          paths:
            - /root/.nuget/packages
          key: dotnet-deps-v1-{{ checksum "SecurePortal.csproj" }}

      # Build
      - run:
          name: Build
          command: dotnet build SecurePortal.csproj --configuration Release --no-restore

      # Test
      - run:
          name: Test
          command: dotnet test --configuration Release --no-build

      # Publish
      - run:
          name: Publish
          command: |
            dotnet publish SecurePortal.csproj \
              --configuration Release \
              --no-restore \
              --output ./publish

      # Store artifacts
      - store_artifacts:
          path: ./publish
          destination: app-publish

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
