version: 2.1

jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    working_directory: ~/repo
    steps:
      - checkout

      - restore_cache:
          keys:
            - dotnet-deps-v1-{{ checksum "SecurePortal.csproj" }}
            - dotnet-deps-v1-

      - run:
          name: Restore dependencies
          command: dotnet restore SecurePortal.csproj

      - save_cache:
          paths:
            - /root/.nuget/packages
          key: dotnet-deps-v1-{{ checksum "SecurePortal.csproj" }}

      - run:
          name: Build
          command: dotnet build SecurePortal.csproj --configuration Release --no-restore

      - run:
          name: Test
          command: dotnet test --configuration Release --no-build --logger "trx"

  sonar-scan:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    working_directory: ~/repo
    steps:
      - checkout

      - restore_cache:
          keys:
            - dotnet-deps-v1-{{ checksum "SecurePortal.csproj" }}
            - dotnet-deps-v1-

      - run:
          name: Install dotnet-sonarscanner
          command: dotnet tool install --global dotnet-sonarscanner

      - run:
          name: Add dotnet tools to PATH
          command: echo 'export PATH="$PATH:/root/.dotnet/tools"' >> $BASH_ENV

      - run:
          name: Begin SonarCloud analysis
          command: |
            dotnet sonarscanner begin \
              /k:"${sonar_project_key}" \
              /n:"${sonar_project_key}" \
              /o:"${sonar_org}" \
              /v:"1.0" \
              /d:sonar.host.url=https://sonarcloud.io \
              /d:sonar.token="${sonar_token}" \
              /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
              /d:sonar.coverage.exclusions="**/Migrations/**,**/obj/**,**/bin/**,**/Test/**"

      - run:
          name: Build and Test with Coverage
          command: |
            dotnet build SecurePortal.csproj --configuration Release
            dotnet test SecurePortal.csproj --configuration Release --no-build \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=opencover

      - run:
          name: End SonarCloud analysis
          command: dotnet sonarscanner end /d:sonar.token="${sonar_token}"

workflows:
  version: 2
  build-and-analyze:
    jobs:
      - build
      - sonar-scan:
          requires:
            - build
